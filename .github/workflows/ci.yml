name: CI

# Todo lo que hay que verificar antes de que un cambio entre a main.
# Hasta ahora esto se corría a mano, y así llegaron 12 tests rotos a la
# rama principal sin que nadie se enterara.
on:
  push:
    branches: [main]
  pull_request:
  # Permite dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Si se pushea dos veces seguidas, cancela la corrida vieja: no tiene
# sentido esperar el resultado de un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # El build no necesita credenciales reales: los clientes de
      # Supabase se crean de forma lazy (ver src/lib/supabase/cliente.ts),
      # así que alcanza con que las variables existan. Nada acá toca la
      # base: no hay secretos de producción en CI.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      # Silencia el aviso de telemetría en los logs.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` corre el postinstall, que copia el worker de pdf.js y
      # los modelos faciales a public/. El build los da por hechos.
      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci

      - name: Build de producción
        run: npm run build

  # La lógica que vive en SQL no la toca ningún test de Jest, y una
  # migración se **aplica** sin validar el cuerpo de sus funciones
  # plpgsql: un error de tipos adentro de un RPC pasa el deploy en verde y
  # revienta en la primera llamada real. Ya ocurrió una vez.
  #
  # Además, al mergear a main las migraciones se aplican solas a la base
  # productiva (ver supabase/config.toml), así que este job es la última
  # oportunidad de que fallen en un lugar que no le duela a nadie.
  base-de-datos:
    name: Migraciones y RPC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Postgres local
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,pooler

      # Aplica las 53 migraciones desde cero. Acá se cae cualquier error
      # de sintaxis o de orden entre migraciones.
      - name: Aplicar migraciones desde cero
        run: supabase db reset

      # Y acá, lo que la sintaxis no ve: que las funciones hagan lo que
      # dicen. Cada assert que falla corta con exit ≠ 0.
      - name: Probar funciones y triggers
        run: |
          docker exec -i "$(docker ps -qf name=supabase_db)" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            < supabase/tests/rpc.test.sql

      # F-01: la matriz de acceso del kiosco. Un fichaje 1:N sin terminal
      # vinculada dejaba que cualquier usuario del tenant fichara por
      # cualquier otro, y la marca quedaba con cara de fichaje facial
      # legítimo en la planilla de liquidación. Si esto se rompe, se
      # rompe en silencio: no hay pantalla que lo muestre.
      - name: Autorización de terminal (F-01)
        run: |
          docker exec -i "$(docker ps -qf name=supabase_db)" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            < supabase/tests/terminal_vinculada.test.sql

      # F-07 y F-12: que el método lo decida la base y no el request, y
      # que la anulación exija motivo, deje actor y salga de los
      # cálculos. Las dos cosas alimentan la liquidación, así que un
      # error acá se paga en plata.
      - name: Método derivado y anulación (F-07 / F-12)
        run: |
          docker exec -i "$(docker ps -qf name=supabase_db)" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            < supabase/tests/metodo_y_anulacion.test.sql

      # Race de fichaje (FIC-004): dos RPC concurrentes del mismo
      # empleado deben alternar ingreso/egreso, nunca duplicar el tipo.
      - name: Concurrencia de fichaje
        run: bash supabase/tests/concurrencia_fichaje.sh

  # Informativo: no frena el merge, pero deja el estado a la vista en
  # cada PR en vez de que alguien se acuerde de correrlo cada tanto.
  dependencias:
    name: Vulnerabilidades conocidas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high
